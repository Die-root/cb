<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regalos para la más chiquita 💖</title>
    <style>
        :root {
            /* Paleta minimalista de cumpleaños y amor */
            --bg-main: linear-gradient(135deg, #fff5f5 0%, #fff0f5 100%);
            --text-main: #4a3b32;
            --text-sub: #8a7a71;
            --card-bg: rgba(255, 255, 255, 0.9);
            --accent-color: #ff85a2; /* Rosa pastel romántico */
            --border-color: #fbd3db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .countdown-container {
            text-align: center;
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(255, 133, 162, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            z-index: 10;
            max-width: 550px;
            width: 100%;
            box-sizing: border-box;
        }

        .decor-emoji {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }

        /* Estilos aplicados al gatito */
        .cat-image {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            margin: 5px 0 25px 0;
            border: 4px solid #fff0f2;
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.15);
        }

        h1 {
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 600;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1.05rem;
            margin: 0 0 20px 0;
            font-weight: 400;
            line-height: 1.5;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 5px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #fff0f2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.01);
        }

        .number {
            font-size: 2.4rem;
            font-weight: 300;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 6px;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-sub);
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @media (max-width: 500px) {
            .countdown-container {
                padding: 40px 20px;
            }
            .number {
                font-size: 1.8rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            .cat-image {
                width: 130px;
                height: 130px;
            }
        }

        /* --- LLUVIA DE AMOR Y CUMPLEAÑOS --- */
        .confetti {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            animation: fall linear forwards;
            font-size: 14px;
            user-select: none;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <div class="decor-emoji">🎂💖✨</div>
        <h1 id="mainTitle">Feliz cumple mi amoooooooor</h1>
        <p class="subtitle">Tienes que esperar para ver tus sorpresas de cumpleeeee!!!! 🎁💘</p>
        
        <img class="cat-image" src="https://lh3.googleusercontent.com/d/1-rsn5V0dsPYov0TqqgPms1EtIl9N2vhz" alt="Imagen de cumpleaños">

        <div class="timer-grid">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Días</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Horas</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Min</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seg</span>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURACIÓN DEL TIEMPO OBJETIVO ("MAÑANA A LAS 6:00 PM")
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 1); 
        targetDate.setHours(18, 0, 0, 0); 

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate.getTime() - now;

            if (difference <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                document.getElementById('mainTitle').innerText = "¡Feliz Cumpleaños! 💕🎉";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 2. GENERADOR MINIMALISTA DE ELEMENTOS FLOTANTES (CORAZONES Y ESTRELLAS)
        function createLoveElements() {
            const elements = ['💖', '💕', '✨', '🌸', '💘', '🍬'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.innerText = elements[Math.floor(Math.random() * elements.length)];
            
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.fontSize = (Math.random() * 10 + 12) + 'px';
            
            const fallDuration = Math.random() * 4 + 5; 
            confetti.style.animationDuration = fallDuration + 's'; 
            
            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, fallDuration * 1000);
        }

        setInterval(createLoveElements, 300);
    </script>
</body>
</html>
